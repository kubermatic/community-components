apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeovn-gobetween-lb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeovn-gobetween-lb.labels" . | nindent 4 }}
data:
  gobetween.toml: |
    [api]
    enabled = false

    [servers.default]
    protocol = "tcp"
    bind = "0.0.0.0:{{ .Values.frontend.port }}"
    balance = "{{ .Values.gobetween.balance }}"
    max_connections = {{ .Values.gobetween.maxConnections }}
    client_idle_timeout = "10m"
    backend_idle_timeout = "10m"
    backend_connection_timeout = "2s"

    [servers.default.discovery]
    kind = "static"
    static_list = [
    {{- range .Values.backend.ipPool.ips }}
        "{{ . }}:{{ $.Values.backend.port }}",
    {{- end }}
    ]

    [servers.default.healthcheck]
    kind = "{{ .Values.gobetween.healthcheck.kind }}"
    interval = "{{ .Values.gobetween.healthcheck.interval }}"
    timeout = "{{ .Values.gobetween.healthcheck.timeout }}"
    fails = {{ .Values.gobetween.healthcheck.fails }}
    passes = {{ .Values.gobetween.healthcheck.passes }}