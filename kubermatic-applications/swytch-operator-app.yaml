apiVersion: apps.kubermatic.k8c.io/v1
kind: ApplicationDefinition
metadata:
  name: swytch-operator
spec:
  displayName: Swytch Operator
  description: Deploy Swytch Redis-compatible caches as injected sidecars or shared servers. Requires Kubernetes 1.33 or newer.
  method: helm
  defaultNamespace:
    name: swytch-system
    create: true
  defaultDeployOptions:
    helm:
      wait: true
      timeout: 5m
  defaultVersion: "1.5.2"
  versions:
    - version: "1.5.2"
      template:
        source:
          helm:
            chartName: swytch-operator
            chartVersion: "1.5.2"
            url: oci://ghcr.io/swytchdb/charts
  documentationURL: https://docs.getswytch.com/start/kubernetes/
  sourceURL: https://github.com/swytchdb/swytch-helm
  logoFormat: png
  logo: 
